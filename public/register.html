<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FroteBiteMessenger — Регистрация</title>
  <link rel="stylesheet" href="brand.css"/>
</head>
<body class="theme-ember">
  <div id="splash" class="splash">
    <div class="splash-inner">
      <img src="logo.svg" alt="logo" class="splash-logo"/>
      <div class="splash-title">FroteBiteMessenger</div>
    </div>
  </div>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-side auth-side-left">
        <div class="brand">
          <img src="logo.svg" alt="logo"/>
          <div class="brand-text">
            <div class="brand-name">FroteBiteMessenger</div>
            <div class="brand-sub">Регистрация</div>
          </div>
        </div>

        <h1>Создай аккаунт</h1>
        <p>Почта + пароль. Потом сможешь переписываться, смотреть каналы и звонить.</p>
        <div class="auth-note">
          Уже есть аккаунт?
          <a href="login.html">Войти</a>
        </div>
      </div>

      <div class="auth-side auth-side-right">
        <form id="registerForm" class="auth-form">
          <label>Почта</label>
          <input id="regEmail" class="input" type="email" placeholder="you@mail.com" required/>

          <label>Пароль (минимум 8 символов)</label>
          <input id="regPass" class="input" type="password" placeholder="********" required/>

          <div class="auth-actions">
            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
            <button type="button" id="toLogin" class="btn btn-secondary">Уже есть аккаунт</button>
          </div>

          <div id="regErr" class="form-error"></div>
        </form>
      </div>
    </div>
  </div>

  <script src="brand.js"></script>
  <script>
    FB.initAuthPage("register");
  </script>
</body>
</html>
