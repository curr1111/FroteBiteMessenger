<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FroteBiteMessenger — Вход</title>
  <link rel="stylesheet" href="brand.css"/>
</head>
<body class="theme-ember">
  <div id="splash" class="splash">
    <div class="splash-inner">
      <img src="logo.svg" alt="logo" class="splash-logo"/>
      <div class="splash-title">FroteBiteMessenger</div>
    </div>
  </div>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-side auth-side-left">
        <div class="brand">
          <img src="logo.svg" alt="logo"/>
          <div class="brand-text">
            <div class="brand-name">FroteBiteMessenger</div>
            <div class="brand-sub">Вход</div>
          </div>
        </div>

        <h1>Войти</h1>
        <p>Введи почту и пароль — и переходи в FroteBiteMessenger.</p>
        <div class="auth-note">
          Нет аккаунта?
          <a href="register.html">Зарегистрироваться</a>
        </div>
      </div>

      <div class="auth-side auth-side-right">
        <form id="loginForm" class="auth-form">
          <label>Почта</label>
          <input id="logEmail" class="input" type="email" placeholder="you@mail.com" required/>

          <label>Пароль</label>
          <input id="logPass" class="input" type="password" placeholder="********" required/>

          <div class="auth-actions">
            <button type="submit" class="btn btn-primary">Войти</button>
            <button type="button" id="toRegister" class="btn btn-secondary">Регистрация</button>
          </div>

          <div id="logErr" class="form-error"></div>
        </form>
      </div>
    </div>
  </div>

  <script src="brand.js"></script>
  <script>
    FB.initAuthPage("login");
  </script>
</body>
</html>
